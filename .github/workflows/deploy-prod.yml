name: Deploy Prod (active — new prod Supabase project)

# Active deployment: fires on push to `main`, targets a NEW dedicated prod
# Supabase project (separate from the dev DB the old live site and staging
# stack use). Runs as its own stack on the VPS, sharing Traefik/Ollama/
# Whisper via docker-compose.app-only.yml. Owns healthcompass.cloud.
#
# Cut over 2026-08-25: this replaced .github/workflows/deploy.yml as the
# push:main deploy target. That workflow is now workflow_dispatch-only
# (manual rollback path) — do not re-enable its push:main trigger while
# this one targets the same domain, or their Traefik routers will collide.
#
# `environment: production` has a required reviewer (binli120) configured in
# GitHub repo settings (Settings → Environments → production → Required
# reviewers) so this can't fire without a human approval, even on push.
#
# PROD_* secrets: real values, set 2026-09-05. The dedicated prod Supabase
# project (ref wyuudqskzrdlvdvelbos) is provisioned — all 26 migrations
# applied, admin seeded, `pnpm db:verify:prod` green. See TODO-prod-supabase.md.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-prod-v2
  cancel-in-progress: false

jobs:
  ci:
    name: CI Gate
    uses: ./.github/workflows/ci.yml
    # No secrets: block — ci.yml's workflow_call trigger doesn't declare any
    # accepted secrets, so passing GITHUB_TOKEN explicitly is invalid syntax
    # (GH rejects the whole workflow at parse time). The automatic
    # GITHUB_TOKEN is available inside ci.yml regardless — it doesn't need
    # to be passed through workflow_call.
    permissions:
      contents: read
      issues: write

  deploy:
    name: SSH → VPS → docker compose up (prod-v2 stack)
    needs: [ci]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Preflight SSH reachability
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          if [ -z "${VPS_HOST:-}" ]; then
            echo "::error::VPS_HOST secret is empty or missing."
            exit 1
          fi
          if ! timeout 15 bash -c "</dev/tcp/${VPS_HOST}/${VPS_SSH_PORT}" 2>/dev/null; then
            echo "::error::Cannot reach the configured VPS over TCP port ${VPS_SSH_PORT}."
            exit 1
          fi

      - name: Deploy to VPS (prod-v2 stack)
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        env:
          # Deploy the exact revision CI validated, not the branch tip at SSH
          # time — a push (or a second approval) landing during the CI +
          # approval window would otherwise ship untested code.
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_REF: ${{ github.ref_name }}
        with:
          host:        ${{ secrets.VPS_HOST }}
          username:    ${{ secrets.VPS_USER }}
          key:         ${{ secrets.VPS_SSH_KEY }}
          port:        ${{ secrets.VPS_SSH_PORT || '22' }}
          timeout:     60s
          script_stop: true
          envs:        DEPLOY_SHA,DEPLOY_REF
          script: |
            set -euo pipefail

            APP_DIR="${{ secrets.PROD_APP_DIR }}"
            REPO_URL="https://${{ secrets.GH_PAT }}@github.com/${{ secrets.REPO_SLUG }}.git"

            if ! command -v docker &>/dev/null; then
              curl -fsSL https://get.docker.com | sh
            fi
            systemctl enable docker --now || true

            echo "▶ Deploying prod-v2 stack to $APP_DIR"
            if [ -d "$APP_DIR/.git" ]; then
              REMOTE=$(git -C "$APP_DIR" remote get-url origin 2>/dev/null || echo "")
              if [ -z "$REMOTE" ]; then
                rm -rf "$APP_DIR"
              fi
            fi
            mkdir -p "$APP_DIR"
            if [ ! -d "$APP_DIR/.git" ]; then
              git clone "$REPO_URL" "$APP_DIR"
            fi
            cd "$APP_DIR"
            git remote set-url origin "$REPO_URL"
            git fetch --all --prune

            # Pin to the CI-validated commit, and refuse it unless it is
            # actually on origin/<branch> (guards manual dispatch against
            # deploying a ref that was never merged / CI'd for this branch).
            if [ -z "${DEPLOY_SHA:-}" ]; then
              echo "::error::DEPLOY_SHA was not passed through to the VPS script."
              exit 1
            fi
            if ! git cat-file -e "${DEPLOY_SHA}^{commit}" 2>/dev/null; then
              echo "::error::commit ${DEPLOY_SHA} not found after fetch."
              exit 1
            fi
            if ! git merge-base --is-ancestor "$DEPLOY_SHA" "origin/${DEPLOY_REF}"; then
              echo "::error::${DEPLOY_SHA} is not on origin/${DEPLOY_REF} — refusing to deploy."
              exit 1
            fi
            echo "▶ Checking out CI-validated commit ${DEPLOY_SHA} (origin/${DEPLOY_REF})"
            git reset --hard "$DEPLOY_SHA"

            echo "⚙️  Writing .env.production.local (prod-v2)..."
            ENV_FILE="$APP_DIR/.env.production.local"
            printf '%s\n' \
              "STACK_NAME=prod" \
              "DOMAIN=${{ secrets.PROD_DOMAIN }}" \
              "DATABASE_URL=${{ secrets.PROD_DATABASE_URL }}" \
              "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.PROD_SUPABASE_URL }}" \
              "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.PROD_SUPABASE_ANON_KEY }}" \
              "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ secrets.PROD_SUPABASE_PUBLISHABLE_KEY }}" \
              "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.PROD_SUPABASE_SERVICE_ROLE_KEY }}" \
              "OLLAMA_BASE_URL=http://ollama:11434" \
              "OLLAMA_MODEL=llama3.2:1b" \
              "WHISPER_BASE_URL=http://whisper:9000" \
              "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" \
              "RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}" \
              "FROM_EMAIL=${{ secrets.PROD_FROM_EMAIL }}" \
              "NEXT_PUBLIC_APP_URL=https://${{ secrets.PROD_DOMAIN }}" \
              "MCP_CLIENT_ID=${{ secrets.PROD_MCP_CLIENT_ID }}" \
              "MCP_CLIENT_SECRET=${{ secrets.PROD_MCP_CLIENT_SECRET }}" \
              "PROFILE_ENCRYPTION_KEY=${{ secrets.PROD_PROFILE_ENCRYPTION_KEY }}" \
              "ADMIN_PASSKEY_SESSION_SECRET=${{ secrets.PROD_ADMIN_PASSKEY_SESSION_SECRET }}" \
              "CRON_SECRET=${{ secrets.PROD_CRON_SECRET }}" \
              > "$ENV_FILE"
            chmod 600 "$ENV_FILE"

            # ── Identify the legacy app-facing containers (do NOT stop them yet) ──
            # The primary docker-compose.yml stack (deployed by the old, now
            # manual-only deploy.yml) still runs its own app/masshealth-analysis/
            # mcp-server containers, all with Traefik routers on Host(`${DOMAIN}`) —
            # the same domain this prod-v2 stack now owns. Traefik/Ollama/Whisper
            # from that stack must keep running (this stack depends on them), so
            # we can't just stop the whole legacy stack — only the three
            # app-facing services that collide on this host. Matched by Compose
            # service label (not APP_DIR, which lives in a different GH
            # environment) and explicitly excluded from our own stacks so this
            # never touches the staging or prod-v2 app/mcp containers themselves.
            #
            # One `docker ps` call per service name: repeating
            # --filter "label=com.docker.compose.service=..." on a single call
            # ANDs the clauses (a container would need all three values on its
            # one service label), which matches nothing. Union the per-service
            # results instead; the loop below de-dups intent via the project
            # guard and tolerates a container that has already stopped.
            #
            # Cutover order matters: the previously-serving stack stays up
            # through the build + health check, and a failed build / `compose
            # up` / health loop must never become an outage.
            #   - First cutover: the legacy docker-compose.yml stack is that
            #     serving stack; on failure we tear the half-started prod-v2
            #     stack down and leave legacy running. Legacy is retired only
            #     AFTER prod-v2 passes its health check. During the overlap both
            #     stacks route Host(`${PROD_DOMAIN}`); Traefik keeps the
            #     first-seen (legacy) and skips the duplicate, so traffic stays
            #     on legacy until we stop it below.
            #   - Every deploy after that: legacy is gone. The rollback target
            #     is the previous prod-v2 image, snapshotted to a *-rollback tag
            #     before the build and restored on failure (see `rollback()`).
            # NOTE: this runs through the VPS root account's login shell, which
            # is zsh — keep it POSIX-plain. zsh -c chokes on `case … ) x ;;`
            # (parse error near `;`) and on multi-line `$( … for … done )`, so
            # the service union is a one-liner and the self-stack skip is an
            # `if`, not a `case`.
            LEGACY_IDS=$(for svc in app mcp-server masshealth-analysis; do docker ps -q --filter "label=com.docker.compose.service=$svc"; done)
            LEGACY_RETIRE_IDS=""
            for cid in $LEGACY_IDS; do
              project=$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project" }}' "$cid" 2>/dev/null || echo "")
              if [ "$project" = "masshealth-staging" ] || [ "$project" = "masshealth-prod" ]; then
                continue
              fi
              LEGACY_RETIRE_IDS="$LEGACY_RETIRE_IDS $cid"
            done

            COMPOSE="docker compose -f docker-compose.app-only.yml -p masshealth-prod"

            # ── Snapshot the currently-serving prod-v2 images BEFORE the build ──
            # `image:` in the compose file is a static tag (healthcompass-ma:prod,
            # healthcompass-mcp:prod), so `up --build` overwrites it in place and
            # recreates the containers. Capture the image each running container
            # is on right now and pin it under a *-rollback tag. After the first
            # cutover this — not the legacy stack — is what a failed redeploy
            # rolls back to. Empty on the very first deploy (no prod-v2 running
            # yet); then the legacy fallback below applies instead.
            HAVE_ROLLBACK=0
            APP_CID=$($COMPOSE ps -q app 2>/dev/null | head -n1 || true)
            MCP_CID=$($COMPOSE ps -q mcp-server 2>/dev/null | head -n1 || true)
            if [ -n "${APP_CID:-}" ]; then
              PREV_APP_IMG=$(docker inspect -f '{{ .Image }}' "$APP_CID" 2>/dev/null || echo "")
              if [ -n "$PREV_APP_IMG" ]; then
                docker tag "$PREV_APP_IMG" healthcompass-ma:prod-rollback
                HAVE_ROLLBACK=1
              fi
            fi
            if [ -n "${MCP_CID:-}" ]; then
              PREV_MCP_IMG=$(docker inspect -f '{{ .Image }}' "$MCP_CID" 2>/dev/null || echo "")
              if [ -n "$PREV_MCP_IMG" ]; then
                docker tag "$PREV_MCP_IMG" healthcompass-mcp:prod-rollback
              fi
            fi

            rollback() {
              if [ "$HAVE_ROLLBACK" = "1" ]; then
                echo "↩️  Deploy failed — restoring previous prod-v2 images and recreating" >&2
                docker tag healthcompass-ma:prod-rollback healthcompass-ma:prod
                docker image inspect healthcompass-mcp:prod-rollback > /dev/null 2>&1 \
                  && docker tag healthcompass-mcp:prod-rollback healthcompass-mcp:prod
                # --no-build: reuse the restored images, do not rebuild from the
                # bad checkout. Keeps the last known-good prod-v2 stack serving.
                $COMPOSE --env-file "$ENV_FILE" up -d --force-recreate --no-build --remove-orphans || true
                for i in $(seq 1 24); do
                  if $COMPOSE exec -T app node -e "fetch('http://127.0.0.1:3000/api/health/db').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))" > /dev/null 2>&1; then
                    echo "✅ Rolled back to previous prod-v2 image after $((i * 5))s" >&2
                    return 0
                  fi
                  sleep 5
                done
                echo "::error::Rollback health check FAILED — prod-v2 may be down, manual intervention required" >&2
                return 1
              fi
              # First cutover only: no prior prod-v2 image exists. Tear the
              # half-started stack down and leave the legacy stack (never
              # stopped on this path) serving the domain.
              echo "↩️  Deploy failed on first cutover — removing half-started prod-v2 stack, keeping legacy live" >&2
              $COMPOSE down --remove-orphans || true
              for cid in $LEGACY_RETIRE_IDS; do
                docker start "$cid" > /dev/null 2>&1 || true
              done
            }

            echo "▶ Building and starting prod-v2 stack (previous stack still live)..."
            if ! $COMPOSE --env-file "$ENV_FILE" up -d --build --remove-orphans; then
              rollback || true
              echo "::error::prod-v2 build/startup failed — see rollback result above" >&2
              exit 1
            fi

            echo "⏳ Waiting for prod-v2 app (up to 2 min)..."
            PROD_HEALTHY=0
            for i in $(seq 1 24); do
              if $COMPOSE exec -T app node -e "fetch('http://127.0.0.1:3000/api/health/db').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))" > /dev/null 2>&1; then
                echo "✅ Prod-v2 app is up after $((i * 5))s"
                PROD_HEALTHY=1
                break
              fi
              sleep 5
            done

            if [ "$PROD_HEALTHY" != "1" ]; then
              echo "❌ Prod-v2 app did not pass health check — last 80 log lines:" >&2
              $COMPOSE logs --tail=80 app || true
              rollback || true
              echo "::error::prod-v2 health check failed — see rollback result above" >&2
              exit 1
            fi

            # ── prod-v2 is healthy — now retire the legacy app-facing containers ──
            # (no-op after the first cutover: legacy is already gone)
            echo "🔻 Retiring legacy app/analysis/mcp containers on ${{ secrets.PROD_DOMAIN }}..."
            for cid in $LEGACY_RETIRE_IDS; do
              name=$(docker inspect -f '{{ .Name }}' "$cid" 2>/dev/null || echo "$cid")
              project=$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project" }}' "$cid" 2>/dev/null || echo "")
              echo "  stopping legacy container $name (project=$project)"
              docker stop "$cid" > /dev/null || true
            done

            # Deploy succeeded — the pre-build snapshot is now the rollback
            # target for the NEXT deploy. Re-pin it to the image we just
            # validated so a future failed redeploy restores this one.
            docker tag healthcompass-ma:prod healthcompass-ma:prod-rollback
            docker image inspect healthcompass-mcp:prod > /dev/null 2>&1 \
              && docker tag healthcompass-mcp:prod healthcompass-mcp:prod-rollback

            # Prune dangling images but KEEP the tagged *-rollback ones.
            docker image prune -f
            echo "🚀 Prod-v2 deploy complete"

      - name: Notify on failure
        if: failure()
        run: echo "::error::Prod-v2 deploy failed — check logs above"
