name: E2E — Cloud Smoke Tests

on:
  push:
    branches: [main]
  # Run automatically after every successful deploy — the active prod path
  # (Deploy Prod → healthcompass.cloud, prod Supabase project), the active
  # staging pipeline (Deploy Staging → staging.healthcompass.cloud, dev DB),
  # and the legacy prod path (workflow_dispatch-only now, kept as a manual
  # rollback). The `environment:`, ref, E2E_BASE_URL and
  # NEXT_PUBLIC_SUPABASE_URL expressions below select the right target per
  # source workflow. Both branches listed since GH's workflow_run branch
  # filter is shared across every workflow named here, not per-name.
  workflow_run:
    workflows:
      - "Deploy Prod (active — new prod Supabase project)"
      - "Deploy Staging (passive — dev database)"
      - "Deploy to Hostinger VPS"
    types: [completed]
    branches: [main, dev]
  # Allow manual trigger against any branch/ref
  workflow_dispatch:

# Scope the group per target branch so a staging deploy (dev) and a prod
# deploy (main) finishing close together don't cancel each other's E2E run.
# Within one branch, a newer run still supersedes the older one.
concurrency:
  group: e2e-cloud-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify Changed Files
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.push_filter.outputs.app || steps.defaults.outputs.app }}
      e2e: ${{ steps.push_filter.outputs.e2e || steps.defaults.outputs.e2e }}

    steps:
      - uses: actions/checkout@v4

      - name: Detect app vs e2e changes
        if: ${{ github.event_name == 'push' }}
        id: push_filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            app:
              - '**'
              - '!e2e/**'
              - '!playwright.config.ts'
              - '!.github/**'
              - '!README.md'
              - '!TEST_PLAN.md'
              - '!demo/**'
              - '!coverage/**'
            e2e:
              - 'e2e/**'
              - 'playwright.config.ts'
              - '.github/workflows/e2e-cloud.yml'

      - name: Default change set for non-push runs
        if: ${{ github.event_name != 'push' }}
        id: defaults
        run: |
          echo "app=false" >> "$GITHUB_OUTPUT"
          echo "e2e=false" >> "$GITHUB_OUTPUT"

  e2e:
    name: Playwright E2E → Hostinger
    needs: [changes]
    # Run manually, after a successful deploy, or on pushes that only changed e2e files.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' || (github.event_name == 'push' && needs.changes.outputs.e2e == 'true' && needs.changes.outputs.app != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Always the `dev` environment (no protection rules). We deliberately do
    # NOT use `environment: production` here: a `workflow_run`-triggered job
    # always executes against the repo default branch ref (`dev`), and the
    # `production` environment's deployment-branch policy is locked to `main`,
    # so GitHub rejects the job in ~10s ("Branch 'dev' is not allowed to
    # deploy to production") before any step runs — and `production` also
    # carries a required-reviewer rule that would otherwise stall the smoke.
    # The prod target's two non-sensitive values (PROD_DOMAIN,
    # PROD_SUPABASE_URL) are repo-level secrets, selected below by
    # workflow_run.name. There are no E2E_* account secrets for the prod
    # project — the authenticated specs fall back to demo-data.ts defaults
    # (not seeded in prod) and self-skip via the IS_CLOUD_SUPABASE /
    # auth-state guards, leaving an unauthenticated smoke.
    environment: dev

    steps:
      # Check out the exact revision that was deployed, so the test files
      # match the running code.
      #
      # Deploy Prod and Deploy Staging now deploy `github.sha` verbatim and
      # refuse anything that isn't an ancestor of origin/main / origin/dev
      # (and refuse a triggered ref that isn't main / dev). For a workflow_run
      # from either, workflow_run.head_sha IS that deployed commit — use it.
      #
      # The legacy "Deploy to Hostinger VPS" (deploy.yml) still hardcodes
      # `git reset --hard origin/main` regardless of dispatch ref, so its
      # head_sha can't be trusted — pin that path to 'main'.
      #
      # Direct push / workflow_dispatch of THIS workflow: github.sha is the
      # intended ref.
      - uses: actions/checkout@v4
        with:
          ref: ${{ (github.event.workflow_run.name == 'Deploy Prod (active — new prod Supabase project)' || github.event.workflow_run.name == 'Deploy Staging (passive — dev database)') && github.event.workflow_run.head_sha || github.event.workflow_run.name == 'Deploy to Hostinger VPS' && 'main' || github.sha }}

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Run E2E tests against cloud
        run: pnpm test:e2e
        env:
          CI: "true"
          # Target domain per source workflow:
          #   Deploy Prod    → PROD_DOMAIN   (healthcompass.cloud, prod project)
          #   Deploy Staging → STAGING_DOMAIN (staging.healthcompass.cloud)
          #   legacy / push / dispatch → DOMAIN
          E2E_BASE_URL: "https://${{ github.event.workflow_run.name == 'Deploy Staging (passive — dev database)' && secrets.STAGING_DOMAIN || github.event.workflow_run.name == 'Deploy Prod (active — new prod Supabase project)' && secrets.PROD_DOMAIN || secrets.DOMAIN }}"
          # Lets the specs' IS_CLOUD_SUPABASE guard evaluate true so MFA-gated
          # reviewer/admin flows (which need aal2 and can't complete TOTP in
          # automation) are skipped instead of failing. Must match the project
          # the deployed site actually runs on: prod project for Deploy Prod,
          # dev project for the staging + legacy paths.
          NEXT_PUBLIC_SUPABASE_URL: ${{ github.event.workflow_run.name == 'Deploy Prod (active — new prod Supabase project)' && secrets.PROD_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          # Explicit credentials — fall back to demo-data.ts defaults when the
          # secrets are absent (e.g. forks / PRs from external contributors).
          # Accounts must exist in the cloud Supabase project.
          E2E_DEMO_EMAIL:         ${{ secrets.E2E_DEMO_EMAIL }}
          E2E_DEMO_PASSWORD:      ${{ secrets.E2E_DEMO_PASSWORD }}
          E2E_REVIEWER_EMAIL:     ${{ secrets.E2E_REVIEWER_EMAIL }}
          E2E_REVIEWER_PASSWORD:  ${{ secrets.E2E_REVIEWER_PASSWORD }}
          E2E_ADMIN_EMAIL:        ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD:     ${{ secrets.E2E_ADMIN_PASSWORD }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-cloud-report
          path: e2e/report/
          retention-days: 14

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-cloud-screenshots
          path: test-results/
          retention-days: 7
