name: E2E — Cloud Smoke Tests

on:
  push:
    branches: [main]
  # Run automatically after every successful deploy — legacy prod path
  # (workflow_dispatch-only now, kept as a manual rollback) and the active
  # staging pipeline. E2E_BASE_URL below picks the right domain per source
  # workflow. Both branches listed since GH's workflow_run branch filter is
  # shared across every workflow named here, not per-name.
  workflow_run:
    workflows: ["Deploy to Hostinger VPS", "Deploy Staging (passive — dev database)"]
    types: [completed]
    branches: [main, dev]
  # Allow manual trigger against any branch/ref
  workflow_dispatch:

# Scope the group per target branch so a staging deploy (dev) and a prod
# deploy (main) finishing close together don't cancel each other's E2E run.
# Within one branch, a newer run still supersedes the older one.
concurrency:
  group: e2e-cloud-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify Changed Files
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.push_filter.outputs.app || steps.defaults.outputs.app }}
      e2e: ${{ steps.push_filter.outputs.e2e || steps.defaults.outputs.e2e }}

    steps:
      - uses: actions/checkout@v4

      - name: Detect app vs e2e changes
        if: ${{ github.event_name == 'push' }}
        id: push_filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            app:
              - '**'
              - '!e2e/**'
              - '!playwright.config.ts'
              - '!.github/**'
              - '!README.md'
              - '!TEST_PLAN.md'
              - '!demo/**'
              - '!coverage/**'
            e2e:
              - 'e2e/**'
              - 'playwright.config.ts'
              - '.github/workflows/e2e-cloud.yml'

      - name: Default change set for non-push runs
        if: ${{ github.event_name != 'push' }}
        id: defaults
        run: |
          echo "app=false" >> "$GITHUB_OUTPUT"
          echo "e2e=false" >> "$GITHUB_OUTPUT"

  e2e:
    name: Playwright E2E → Hostinger
    needs: [changes]
    # Run manually, after a successful deploy, or on pushes that only changed e2e files.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' || (github.event_name == 'push' && needs.changes.outputs.e2e == 'true' && needs.changes.outputs.app != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev

    steps:
      # Explicit ref required — and workflow_run.head_sha is NOT safe to use
      # here. Both deploy workflows can be workflow_dispatch'd against any
      # ref, but their deploy scripts ignore that and hardcode what they
      # actually check out on the VPS (deploy-staging.yml always resets to
      # origin/dev, deploy.yml always resets to origin/main) — so
      # head_sha reflects the *dispatch ref*, not what was actually
      # deployed. E.g. dispatching staging against "main" would deploy
      # dev's code but head_sha would point at main, and we'd run main's
      # test files against a dev deployment. Hardcode the ref per source
      # workflow instead, matching what each one really deploys. Falls
      # back to github.sha for direct push/workflow_dispatch of this
      # workflow itself, where the triggering ref IS the intended one.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.name == 'Deploy Staging (passive — dev database)' && 'dev' || github.event.workflow_run.name == 'Deploy to Hostinger VPS' && 'main' || github.sha }}

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Run E2E tests against cloud
        run: pnpm test:e2e
        env:
          CI: "true"
          # Staging deploys test staging.healthcompass.cloud; everything else
          # (legacy prod deploy, manual dispatch, push:main) tests DOMAIN.
          E2E_BASE_URL: "https://${{ github.event.workflow_run.name == 'Deploy Staging (passive — dev database)' && secrets.STAGING_DOMAIN || secrets.DOMAIN }}"
          # Lets the specs' IS_CLOUD_SUPABASE guard evaluate true so MFA-gated
          # reviewer/admin flows (which need aal2 and can't complete TOTP in
          # automation) are skipped instead of failing. Both deploy paths this
          # workflow chains off run against the dev Supabase project.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          # Explicit credentials — fall back to demo-data.ts defaults when the
          # secrets are absent (e.g. forks / PRs from external contributors).
          # Accounts must exist in the cloud Supabase project.
          E2E_DEMO_EMAIL:         ${{ secrets.E2E_DEMO_EMAIL }}
          E2E_DEMO_PASSWORD:      ${{ secrets.E2E_DEMO_PASSWORD }}
          E2E_REVIEWER_EMAIL:     ${{ secrets.E2E_REVIEWER_EMAIL }}
          E2E_REVIEWER_PASSWORD:  ${{ secrets.E2E_REVIEWER_PASSWORD }}
          E2E_ADMIN_EMAIL:        ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD:     ${{ secrets.E2E_ADMIN_PASSWORD }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-cloud-report
          path: e2e/report/
          retention-days: 14

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-cloud-screenshots
          path: test-results/
          retention-days: 7
