packages:
  - "."

overrides:
  vite: "^6.0.0"
  lodash: "4.18.1"
  fast-uri: ">=4.1.2"
  ws: ">=8.21.0"
  engine.io: ">=6.6.9"
  form-data: ">=4.0.6"
  "brace-expansion@1": "^1.1.16"
  "brace-expansion@2": "^2.1.4"
  "brace-expansion@5": "^5.0.9"
  "gray-matter>js-yaml": "^3.15.1"
  "js-yaml@4": "^4.3.0"
  "@opentelemetry/sdk-node>@opentelemetry/propagator-jaeger": "^2.9.0"
  sharp: "^0.35.3"
  postcss: ">=8.5.18"
  nanoid: ">=5.1.16"
  socket.io-parser: ">=4.2.7"

packageExtensions:
  "socket.io-adapter@*":
    dependencies:
      ws: ">=8.21.0"

dangerouslyAllowAllBuilds: true

blockExoticSubdeps: true
trustPolicy: no-downgrade
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  # Patched-CVE release, younger than the 7-day window — needed to close
  # GHSA-7p8r-x3mc-p8w7 (fast-uri host confusion). Remove this exclude once
  # the release is older than minimumReleaseAge on its own.
  - fast-uri@4.1.2
  # Patched-CVE release, younger than the 7-day window — needed to close
  # GHSA-6gpp-xcg3-4w24 (middleware/proxy bypass) and GHSA-m99w-x7hq-7vfj
  # (Server Actions DoS). Remove once older than minimumReleaseAge on its own.
  - next@16.2.11
  - "@next/*"
  # Patched-CVE releases, younger than the 7-day window — needed to close
  # GHSA-6g55-p6wh-862q, GHSA-r28c-9q8g-f849 (postcss), GHSA-28wg-ghj8-5hjv,
  # GHSA-2v37-7h3g-55p8 (nanoid), GHSA-2m8v-j782-fhvr (socket.io-parser).
  # Remove each once older than minimumReleaseAge on its own.
  - postcss@8.5.18
  - nanoid@5.1.16
  - socket.io-parser@4.2.7

trustPolicyExclude:
  # Verified 2026-08-14 against npm registry maintainer/publish metadata —
  # all 6 predate npm provenance attestation becoming default, no ownership
  # transfer, maintainers match established upstream owners. Flagged only
  # because trustPolicy: no-downgrade was newly enabled above.
  - chokidar@4.0.3 # paulmillr (upstream owner), published 2024-12-18
  - eslint-import-resolver-typescript@3.10.1 # jounqin (upstream owner), published 2025-04-21
  - nanoid@3.3.14 # ai/sitnik (upstream owner), published 2026-06-20
  - react-email@5.2.11 # gabrielmfern (upstream team), published 2026-04-17
  - semver@6.3.1 # npm-cli-ops/lukekarrys (upstream owner), published 2023-07-10
  - undici-types@6.21.0 # matteo.collina (upstream owner), published 2024-11-13
