# =============================================================================
# App-only compose overlay — for stacks that share the primary stack's
# Traefik, Ollama, Whisper, and OpenObserve (declared in docker-compose.yml).
#
# Used by the staging and prod-v2 deploy pipelines. Each stack is deployed
# with its own `-p <project-name>` (COMPOSE_PROJECT_NAME) and its own
# .env.production.local (own DOMAIN, own Supabase project, own secrets) —
# container names are auto-prefixed by the project name so multiple stacks
# can coexist on one VPS without colliding.
#
# Requires the primary stack (docker-compose.yml) already running on this
# host: shares its `proxy` (Traefik) and `healthcompass-internal` (Ollama/
# Whisper) networks, and its Traefik instance for TLS/routing.
#
# STACK_NAME must be set in the env file (e.g. STACK_NAME=staging) — used to
# namespace Traefik router/service names so they don't collide with the
# primary stack's `app`/`mcp` routers or with each other.
# =============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
        NEXT_PUBLIC_MASSHEALTH_FORMS_BASE_URL: ${NEXT_PUBLIC_MASSHEALTH_FORMS_BASE_URL:-}
        NEXT_PUBLIC_MASSHEALTH_ANALYSIS_BASE_URL: ${NEXT_PUBLIC_MASSHEALTH_ANALYSIS_BASE_URL:-}
        NEXT_PUBLIC_OPENOBSERVE_RUM_ENABLED: ${NEXT_PUBLIC_OPENOBSERVE_RUM_ENABLED:-false}
        NEXT_PUBLIC_OPENOBSERVE_RUM_CLIENT_TOKEN: ${NEXT_PUBLIC_OPENOBSERVE_RUM_CLIENT_TOKEN:-}
        NEXT_PUBLIC_OPENOBSERVE_RUM_APPLICATION_ID: ${NEXT_PUBLIC_OPENOBSERVE_RUM_APPLICATION_ID:-healthcompass-web}
        NEXT_PUBLIC_OPENOBSERVE_RUM_SITE: ${NEXT_PUBLIC_OPENOBSERVE_RUM_SITE:-}
        NEXT_PUBLIC_OPENOBSERVE_RUM_SERVICE: ${NEXT_PUBLIC_OPENOBSERVE_RUM_SERVICE:-healthcompass-web}
        NEXT_PUBLIC_OPENOBSERVE_RUM_ENV: ${NEXT_PUBLIC_OPENOBSERVE_RUM_ENV:-production}
        NEXT_PUBLIC_OPENOBSERVE_RUM_VERSION: ${NEXT_PUBLIC_OPENOBSERVE_RUM_VERSION:-}
        NEXT_PUBLIC_OPENOBSERVE_RUM_ORG: ${NEXT_PUBLIC_OPENOBSERVE_RUM_ORG:-default}
        NEXT_PUBLIC_OPENOBSERVE_RUM_INSECURE_HTTP: ${NEXT_PUBLIC_OPENOBSERVE_RUM_INSECURE_HTTP:-false}
        NEXT_PUBLIC_OPENOBSERVE_RUM_API_VERSION: ${NEXT_PUBLIC_OPENOBSERVE_RUM_API_VERSION:-v1}
        NEXT_PUBLIC_OPENOBSERVE_RUM_SESSION_SAMPLE_RATE: ${NEXT_PUBLIC_OPENOBSERVE_RUM_SESSION_SAMPLE_RATE:-100}
        NEXT_PUBLIC_OPENOBSERVE_RUM_REPLAY_SAMPLE_RATE: ${NEXT_PUBLIC_OPENOBSERVE_RUM_REPLAY_SAMPLE_RATE:-0}
        NEXT_PUBLIC_OPENOBSERVE_RUM_SESSION_REPLAY_ENABLED: ${NEXT_PUBLIC_OPENOBSERVE_RUM_SESSION_REPLAY_ENABLED:-false}
        NEXT_PUBLIC_OPENOBSERVE_RUM_PRIVACY_LEVEL: ${NEXT_PUBLIC_OPENOBSERVE_RUM_PRIVACY_LEVEL:-mask-user-input}
        NEXT_PUBLIC_BUILD_NUMBER: ${NEXT_PUBLIC_BUILD_NUMBER:-}
        NEXT_PUBLIC_BUILD_SHA: ${NEXT_PUBLIC_BUILD_SHA:-}
    image: healthcompass-ma:${STACK_NAME}
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_PROD: ${DATABASE_URL_PROD:-}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://${DOMAIN}}
      FROM_EMAIL: ${FROM_EMAIL:-}
      OPENOBSERVE_URL: ${OPENOBSERVE_URL:-}
      OPENOBSERVE_USER: ${OPENOBSERVE_USER:-}
      OPENOBSERVE_PASSWORD: ${OPENOBSERVE_PASSWORD:-}
      OPENOBSERVE_ORG: ${OPENOBSERVE_ORG:-default}
      OPENOBSERVE_STREAM: ${OPENOBSERVE_STREAM:-mhealth_app}
      HEALTHCHECK_SIDECAR_URL: ${HEALTHCHECK_SIDECAR_URL:-}
      NEXT_PUBLIC_OPENOBSERVE_RUM_SITE: ${NEXT_PUBLIC_OPENOBSERVE_RUM_SITE:-}
      NEXT_PUBLIC_OPENOBSERVE_RUM_INSECURE_HTTP: ${NEXT_PUBLIC_OPENOBSERVE_RUM_INSECURE_HTTP:-false}
      WHISPER_BASE_URL: ${WHISPER_BASE_URL:-http://whisper:9000}
      PROFILE_ENCRYPTION_KEY: ${PROFILE_ENCRYPTION_KEY}
      ADMIN_PASSKEY_SESSION_SECRET: ${ADMIN_PASSKEY_SESSION_SECRET}
      MCP_CLIENT_ID: ${MCP_CLIENT_ID:-}
      MCP_CLIENT_SECRET: ${MCP_CLIENT_SECRET:-}
      # Shared secret the retention scheduler presents to
      # /api/cron/purge-identity-extractions. Without it the route falls back
      # to "localhost only" and the scheduler's request is rejected.
      CRON_SECRET: ${CRON_SECRET:-}
    env_file:
      - .env.production.local
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${STACK_NAME}-app.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.${STACK_NAME}-app.entrypoints=websecure"
      - "traefik.http.routers.${STACK_NAME}-app.tls=true"
      - "traefik.http.routers.${STACK_NAME}-app.tls.certresolver=le"
      - "traefik.http.services.${STACK_NAME}-app.loadbalancer.server.port=3000"
      - "traefik.http.middlewares.${STACK_NAME}-app-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.routers.${STACK_NAME}-app.middlewares=${STACK_NAME}-app-headers"
    networks:
      proxy: {}
      internal:
        # Stack-specific alias. `healthcompass-internal` is shared across the
        # staging and prod-v2 projects, so the default `app` alias resolves to
        # *either* stack's app container. The scheduler targets this alias so a
        # prod purge can't be routed to the staging app (and vice versa).
        aliases:
          - "${STACK_NAME}-app"

  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    image: healthcompass-mcp:${STACK_NAME}
    restart: unless-stopped
    expose:
      - "3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      BASE_URL: https://${DOMAIN}
      DATABASE_URL: ${DATABASE_URL}
      MCP_CLIENT_ID: ${MCP_CLIENT_ID:-}
      MCP_CLIENT_SECRET: ${MCP_CLIENT_SECRET:-}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${STACK_NAME}-mcp.rule=Host(`${DOMAIN}`) && (PathPrefix(`/mcp`) || PathPrefix(`/authorize`) || PathPrefix(`/token`) || PathPrefix(`/.well-known/oauth-authorization-server`))"
      - "traefik.http.routers.${STACK_NAME}-mcp.entrypoints=websecure"
      - "traefik.http.routers.${STACK_NAME}-mcp.tls=true"
      - "traefik.http.routers.${STACK_NAME}-mcp.tls.certresolver=le"
      - "traefik.http.routers.${STACK_NAME}-mcp.priority=100"
      - "traefik.http.services.${STACK_NAME}-mcp.loadbalancer.server.port=3001"
    networks:
      - proxy

  # Retention scheduler — replaces the Vercel `crons` entry in vercel.json,
  # which does nothing on this VPS. Hits the data-minimization route once a
  # day so extraction PHI older than the route's RETENTION_DAYS is actually
  # purged in prod/staging.
  #
  # Reaches the app over the internal network as `${STACK_NAME}-app:3000` — a
  # stack-specific alias, because the bare `app` alias on the shared
  # healthcompass-internal network resolves to either stack. No public
  # round-trip, no Traefik. Presents CRON_SECRET as a bearer token — the
  # route 401s otherwise.
  #
  # Fires once per calendar day, at or after SCHEDULER_RUN_AT (so a late
  # container start or an earlier failure still gets caught up that day). The
  # success date is recorded only on a 2xx, so a transient 401/5xx / restart
  # retries instead of skipping the purge until tomorrow.
  scheduler:
    image: alpine:3.20
    restart: unless-stopped
    depends_on:
      - app
    environment:
      CRON_SECRET: ${CRON_SECRET:-}
      # STACK_NAME is always set by the deploy env file; target the
      # stack-specific alias declared on the app service above.
      SCHEDULER_TARGET_URL: http://${STACK_NAME}-app:3000/api/cron/purge-identity-extractions
      SCHEDULER_RUN_AT: ${SCHEDULER_RUN_AT:-03:00}
      TZ: ${SCHEDULER_TZ:-America/New_York}
    # NOTE: `$$` escapes Compose interpolation so the shell (not Compose) does
    # the expansion. Plain `$VAR` here would be substituted at `compose up`
    # time and also leak CRON_SECRET into `docker inspect` / `compose config`.
    command:
      - sh
      - -c
      - |
        set -eu
        apk add --no-cache curl tzdata >/dev/null
        if [ -z "$${CRON_SECRET:-}" ]; then
          echo "scheduler: CRON_SECRET is empty — refusing to start (route would 401)." >&2
          exit 1
        fi
        echo "scheduler: will GET $$SCHEDULER_TARGET_URL daily at/after $$SCHEDULER_RUN_AT $$TZ"
        done_date=""
        while true; do
          today="$$(date +%Y-%m-%d)"
          now="$$(date +%H:%M)"
          # HH:MM is zero-padded 24h, so lexical order == chronological order.
          latest="$$(printf '%s\n%s\n' "$$SCHEDULER_RUN_AT" "$$now" | sort | tail -n1)"
          if [ "$$done_date" != "$$today" ] && [ "$$latest" = "$$now" ]; then
            code="$$(curl -sS -m 120 -o /tmp/cron_out -w '%{http_code}' \
              -H "Authorization: Bearer $$CRON_SECRET" "$$SCHEDULER_TARGET_URL" || true)"
            : "$${code:=000}"
            body="$$(cat /tmp/cron_out 2>/dev/null || true)"
            case "$$code" in
              2??)
                done_date="$$today"
                echo "[$$(date -Is)] purge-identity-extractions OK (HTTP $$code) $$body"
                ;;
              *)
                echo "[$$(date -Is)] purge-identity-extractions FAILED (HTTP $$code) $$body — will retry" >&2
                sleep 60
                ;;
            esac
          fi
          sleep 20
        done
    networks:
      - internal

networks:
  proxy:
    name: proxy
    external: true
  internal:
    name: healthcompass-internal
    external: true
